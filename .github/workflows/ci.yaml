name: ci

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t lab-app .

      - name: Run container
        run: docker run -d --name lab-app -p 5000:5000 lab-app

      - name: Smoke test /health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:5000/health; then
              echo ""
              echo "App respondeu na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando..."
            sleep 2
          done
          echo "App não respondeu"
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker logs lab-app
